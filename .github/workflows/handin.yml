name: Beer Factory hand-in
on:
  workflow_dispatch:
  pull_request:
    paths: ['report/**', 'src/models/**', 'src/docs/**']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-science texlive-bibtex-extra biber
      - name: Build report
        working-directory: report/GroupTemplate
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Package reproducible source
        run: |
          mkdir -p handin
          git archive --format=zip HEAD -o handin/beer-factory-source.zip
          cp report/GroupTemplate/main.pdf handin/report.pdf
          cp src/docs/validation-status.md handin/validation-status.md
      - uses: actions/upload-artifact@v4
        with:
          name: beer-factory-group4-handin
          path: handin/
