name: Beer Factory CI
on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: beerfactory
          POSTGRES_USER: beerfactory
          POSTGRES_PASSWORD: development-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U beerfactory -d beerfactory" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y libpaho-mqtt-dev libcjson-dev librdkafka-dev
      - run: make test
      - run: make -C src/machine check-wire
      - run: make -C src/machine all
      - run: mvn -B -f src/backend/pom.xml verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/beerfactory
          TEST_DATABASE_USER: beerfactory
          TEST_DATABASE_PASSWORD: development-only
      - run: npm ci && npm test && npm run build
        working-directory: src/frontend
      - name: Check generated deployment and models
        run: |
          python3 src/tools/generate_deployment.py
          python3 src/models/generate.py
          git diff --exit-code -- compose.yaml src/config src/deploy src/models/generated
          docker compose config -q
          kubectl kustomize src/deploy/k8s/overlays/mock-cluster > /tmp/factory.yaml
          echo 'Formal models generated and checked for freshness. UPPAAL verification was not run: a licensed verifier runtime is required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: src/backend/target/surefire-reports
  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make up PROFILE=smoke
      - run: python3 src/tools/smoke.py --timeout 360
      - run: python3 src/tools/failure_check.py --output /tmp/failure-result.json
      - name: Capture service logs
        if: always()
        run: docker compose --project-directory "$PWD" -f src/deploy/compose/smoke.json logs --no-color > /tmp/beer-factory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-service-logs
          path: |
            /tmp/beer-factory.log
            /tmp/failure-result.json
      - if: always()
        run: docker compose --project-directory "$PWD" -f src/deploy/compose/smoke.json down -v
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, inventory, machine, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LOWER=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/beerfactory-${{ matrix.component }}:${{ github.sha }}
