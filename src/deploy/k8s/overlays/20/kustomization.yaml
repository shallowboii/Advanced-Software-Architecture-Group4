{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "../../base"
  ],
  "patches": [
    {
      "target": {
        "kind": "StatefulSet",
        "name": "unitank"
      },
      "patch": "- op: replace\n  path: /spec/replicas\n  value: 20\n"
    },
    {
      "patch": "{\"apiVersion\": \"apps/v1\", \"kind\": \"Deployment\", \"metadata\": {\"name\": \"backend\"}, \"spec\": {\"template\": {\"spec\": {\"containers\": [{\"name\": \"backend\", \"env\": [{\"name\": \"WIP_LIMIT\", \"value\": \"20\"}]}]}}}}"
    }
  ]
}
