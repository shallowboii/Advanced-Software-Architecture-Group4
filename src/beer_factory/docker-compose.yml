x-machine: &machine
  restart: unless-stopped
  init: true
  environment:
    KAFKA_BROKERS: kafka:9093
    MQTT_HOST: rabbitmq
    MQTT_PORT: "1883"
    MQTT_USERNAME: admin
    MQTT_PASSWORD: admin123
  depends_on:
    rabbitmq:
      condition: service_healthy
    kafka-topics:
      condition: service_completed_successfully
  networks:
    - messaging

services:
  rabbitmq:
    image: rabbitmq:4.4.1
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "1883"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - messaging

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9093"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - messaging

  kafka-topics:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for machine in mashing lautering boiling whirlpooling filtering fermentation_maturation; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 \
            --create --if-not-exists --topic "asaat67.machine.$${machine}" \
            --partitions 1 --replication-factor 1
        done
    networks:
      - messaging

  mashing:
    <<: *machine
    build:
      context: .
      dockerfile: mashing/Dockerfile

  lautering:
    <<: *machine
    build:
      context: .
      dockerfile: lautering/Dockerfile

  boiling:
    <<: *machine
    build:
      context: .
      dockerfile: boiling/Dockerfile

  whirlpooling:
    <<: *machine
    build:
      context: .
      dockerfile: whirlpooling/Dockerfile

  filtering:
    <<: *machine
    build:
      context: .
      dockerfile: filtering/Dockerfile

  fermentation_maturation:
    <<: *machine
    build:
      context: .
      dockerfile: fermentation_maturation/Dockerfile

  redis:
    image: redis:8.10.3
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - messaging

volumes:
  rabbitmq_data:
  kafka_data:
  redis_data:

networks:
  messaging:
    driver: bridge
