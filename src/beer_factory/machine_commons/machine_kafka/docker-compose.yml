# Development brokers for the machines: a single Kafka broker in KRaft mode
# (no ZooKeeper) plus a one-shot service that creates the topics, the Kafka UI
# and an MQTT broker (Mosquitto) for the heartbeats.
#
#   docker compose up -d          # Kafka localhost:9092 (kafka:29092 inside),
#                                 # MQTT localhost:1883 (mosquitto:1883 inside),
#                                 # Kafka UI http://localhost:8080
#   docker compose logs topics    # topic creation output
#   docker compose down -v        # stop and delete all data
#
# Topic auto-creation is OFF: every topic comes from scripts/create-topics.sh.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: beer-kafka
    # Plaintext, no auth: reachable from this computer only.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly; a typo must not create a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
      KAFKA_TOPICS: /opt/kafka/bin/kafka-topics.sh
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/create-topics.sh"]
    restart: "no"

  # MQTT broker for the machine heartbeats (topic "heartbeat"):
  # localhost:1883 on this computer, mosquitto:1883 in the compose network.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: beer-mosquitto
    # No authentication: reachable from this computer only.
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./scripts/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Web UI for browsing topics, messages and consumer groups:
  # http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: beer-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    # No login: reachable from this computer only.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: beer-factory
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
