apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beer-factory

resources:
  - namespace.yaml
  - rabbitmq.yaml
  - kafka.yaml
  - redis.yaml
  - kafka-topics.yaml
  - machines.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: beer-factory
    includeTemplates: true

configMapGenerator:
  - name: machine-config
    literals:
      - KAFKA_BROKERS=kafka:9093
      - MQTT_HOST=rabbitmq
      - MQTT_PORT=1883
  - name: rabbitmq-plugins
    files:
      - config/enabled_plugins
  - name: kafka-bootstrap
    files:
      - config/topics.txt
      - scripts/create-topics.sh
      - scripts/wait-for-topics.sh

secretGenerator:
  - name: messaging-credentials
    literals:
      - username=admin
      - password=admin123

patches:
  - path: machine-defaults.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/component=machine
