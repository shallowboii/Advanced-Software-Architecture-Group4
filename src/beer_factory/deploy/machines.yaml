apiVersion: apps/v1
kind: Deployment
metadata:
  name: mashing
  labels:
    app.kubernetes.io/component: machine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mashing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mashing
        app.kubernetes.io/component: machine
    spec:
      containers:
        - name: machine
          image: docker.io/beer-factory/mashing:dev
          args: ["0"]
---
