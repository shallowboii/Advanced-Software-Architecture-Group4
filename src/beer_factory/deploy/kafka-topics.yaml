# util container that creates the topics on our kafka pod
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: apache/kafka:4.4.0
          command: [/bin/sh, /bootstrap/create-topics.sh]
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms32m -Xmx128m
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: kafka-bootstrap
