apiVersion: apps/v1
kind: Deployment
metadata:
  name: mashing-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mashing
  template:
    metadata:
      labels:
        app: mashing
    spec:
      containers:
      - name: mashing
        image: <your-dockerhub-username>/my-node-app:latest
