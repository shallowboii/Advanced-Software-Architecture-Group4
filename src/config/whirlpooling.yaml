apiVersion: apps/v1
kind: Deployment
metadata:
  name: whirlpooling-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whirlpooling
  template:
    metadata:
      labels:
        app: whirlpooling
    spec:
      containers:
      - name: whirlpooling
        image: <your-dockerhub-username>/my-node-app:latest
