apiVersion: apps/v1
kind: Deployment
metadata:
  name: lautering-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lautering
  template:
    metadata:
      labels:
        app: lautering
    spec:
      containers:
      - name: lautering
        image: <your-dockerhub-username>/my-node-app:latest
